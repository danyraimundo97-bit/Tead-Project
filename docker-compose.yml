services:
  # --- S3-compatible storage ---
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio-data:/data

  # Create buckets for Iceberg warehouse + MLflow artifacts
  mc:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/warehouse;
      mc mb -p local/mlflow;
      exit 0;
      "

  # --- Iceberg catalog (Hive Metastore + DB) ---
  metastore-db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: metastore_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    volumes:
      - metastore-db:/var/lib/mysql

  hive-metastore:
    image: bitsondatadev/hive-metastore:latest
    depends_on: [metastore-db, minio]
    ports:
      - "9083:9083"
    environment:
      METASTORE_DB_HOSTNAME: metastore-db
      METASTORE_TYPE: mysql
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./hive/conf:/opt/apache-hive-metastore-3.0.0-bin/conf:ro

  # --- Trino (query engine) ---
  trino:
    image: trinodb/trino:468
    depends_on: [hive-metastore]
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc:/etc/trino:ro
      - trino-data:/data/trino

  # --- MLflow (tracking server + backend DB) ---
  mlflow-db:
    image: postgres:16
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
    volumes:
      - mlflow-db:/var/lib/postgresql/data

  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    image: tead-mlflow:v2.12.1-pg
    depends_on: [mlflow-db, minio, mc]
    ports:
      - "15000:5000"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://mlflow:mlflow@mlflow-db:5432/mlflow
      --default-artifact-root s3://mlflow/
  
#  flyte:
#    build:
#      context: ./flyte
#      dockerfile: Dockerfile
#    image: tead-flyte-sandbox:v1.16.3-nocontour
#    privileged: true
#    ports:
#      - "30080:30080"
#      - "30081:30081"
#    extra_hosts:
#      - "host.docker.internal:host-gateway"
#    volumes:
#      - flyte-sandbox:/var/lib/flyte
#      - ./flyte-workflows:/root/workflows
#    depends_on:
#      - mlflow
#      - minio

  # --- Loki (log aggregation) ---
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  # --- Grafana (log visualization) ---
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - loki

  # --- Apache Superset (BI & Data Visualization) ---
  superset:
    build: 
      context: ./superset
    user: root
    ports:
      - "8088:8088"
    depends_on:
      - trino
    environment:
      - SUPERSET_SECRET_KEY=jdpt_2026
    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@superset.com --password admin &&
      superset init &&
      gunicorn --bind 0.0.0.0:8088 --worker-class gthread --threads 20 --timeout 120 'superset.app:create_app()'
      "

volumes:
  minio-data:
  metastore-db:
  mlflow-db:
  trino-data:
#  flyte-sandbox: